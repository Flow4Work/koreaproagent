name: Production Smoke Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for production and quota cooldown
        run: sleep 70

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 5 --max-time 20 https://koreaproagent.vercel.app/api/health -o /tmp/health.json
          cat /tmp/health.json
          node -e "const d=require('/tmp/health.json'); if(!d.groqConnected || d.allModelsAvailable === false) process.exit(1)"

      - name: Sales discovery end-to-end
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-time 115 -o /tmp/discovery.json -w '%{http_code}' \
            -X POST https://koreaproagent.vercel.app/api/discover-clients \
            -H 'Content-Type: application/json' \
            --data '{"focus":"Seed to Series B B2B SaaS or AI companies with a recent APAC expansion signal and a clear Korea B2B use case"}')
          echo "HTTP $STATUS"
          cat /tmp/discovery.json
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/discovery.json', 'utf8'));
          if (!Array.isArray(d.leads) || d.leads.length < 1) throw new Error('No leads returned');
          for (const lead of d.leads) {
            if (!lead.company || !lead.url) throw new Error('Lead missing company/url');
            if (!Array.isArray(lead.source_urls) || lead.source_urls.length < 1) throw new Error('Lead missing evidence URL');
            if (!lead.outreach_en) throw new Error('Lead missing outreach email');
          }
          console.log(`SALES PASS: ${d.leads.length} lead(s), pipeline=${d.meta?.pipeline}`);
          NODE

      - name: Cool down model TPM before delivery
        run: sleep 70

      - name: Delivery generation end-to-end
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-time 115 -o /tmp/delivery.json -w '%{http_code}' \
            -X POST https://koreaproagent.vercel.app/api/analyze \
            -H 'Content-Type: application/json' \
            --data '{"clientUrl":"https://www.intercom.com","productHint":"AI customer support SaaS","targetNotes":"Korean ecommerce or app companies with meaningful customer support demand"}')
          echo "HTTP $STATUS"
          cat /tmp/delivery.json
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/delivery.json', 'utf8'));
          if (!Array.isArray(d.prospects) || d.prospects.length < 1) throw new Error('No Korean prospects returned');
          for (const p of d.prospects) {
            if (!p.company || !p.url) throw new Error('Prospect missing company/url');
            if (!Array.isArray(p.source_urls) || p.source_urls.length < 1) throw new Error('Prospect missing evidence URL');
            if (!p.message_ko && !p.message_en) throw new Error('Prospect missing outreach message');
          }
          console.log(`DELIVERY PASS: ${d.prospects.length} prospect(s), pipeline=${d.meta?.pipeline}`);
          NODE
