<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="한국 시장 영업 후보를 빠르게 검증하고 연락처와 한국 테스트 계정을 보강하는 내부 영업 도구" />
  <title>한국 시장 영업 에이전트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tool-v3.css?v=20260729-1" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo">K</div><strong>한국 시장 영업 에이전트</strong></div>
      <div class="tools">
        <div class="status" id="apiStatus"><span class="dot"></span><span>확인 중</span></div>
        <button class="ghost" id="diagBtn" type="button">상태</button>
      </div>
    </header>

    <div id="diagPanel" class="hidden"></div>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-title">
          <h1>영업 후보</h1>
          <small>신호가 강한 회사부터 보고, 연락처·한국 계정은 뒤에서 자동 보강</small>
        </div>
        <button class="primary" id="runBtn" type="button">새 후보 찾기</button>
      </div>
      <div class="summary" id="summary"></div>
      <section class="panel" id="content"></section>
    </main>
  </div>
  <script src="/app-v3.js?v=20260729-1" defer></script>
</body>
</html>
