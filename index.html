      <div class="brand"><div class="logo">H</div><strong>영업 사냥 에이전트</strong></div>
      <div class="tools">
        <div class="status" id="apiStatus"><span class="dot"></span><span>확인 중</span></div>
        <button class="ghost" id="settingsBtn" type="button">검색 설정</button>
        <button class="ghost" id="diagBtn" type="button">상태</button>
      </div>
    </header>

    <div id="settingsPanel" class="settings-panel quality-settings hidden">
      <div class="setting-field"><label>기본 검색</label><input value="Tavily · 항상 사용" disabled /></div>
      <div class="setting-field"><label for="jinaKey">Jina API Key</label><input id="jinaKey" type="password" autocomplete="off" placeholder="기사/행사 → 실제 회사 확인" /></div>
      <div class="setting-field"><label for="braveKey">Brave Search Key</label><input id="braveKey" type="password" autocomplete="off" placeholder="후보 부족할 때 보강" /></div>
      <div class="setting-field"><label for="dartKey">OpenDART API Key</label><input id="dartKey" type="password" autocomplete="off" placeholder="AX 최근 공시 신호" /></div>
      <div class="setting-field"><label for="exaKey">Exa API Key</label><input id="exaKey" type="password" autocomplete="off" placeholder="후보 부족 시 구매 신호 보강" /></div>
      <button class="ghost save-tools" id="saveSearchSettings" type="button">저장</button>
      <span class="settings-note" id="searchSettingsNote">Tavily만 사용</span>
    </div>

    <div id="diagPanel" class="hidden"></div>

    <main class="main">
      <div class="toolbar">
        <div class="toolbar-title">
          <h1>오늘 어디서 돈을 찾을까</h1>
          <small>구매 신호와 실제 담당자를 찾고, 상대가 부담 없이 답할 수 있는 첫 메일까지 만듭니다.</small>
        </div>
        <div class="toolbar-actions">
          <select class="campaign-select" id="campaignSelect" aria-label="영업 캠페인"></select>
          <button class="ghost" id="clearSelectionBtn" type="button">선택 해제</button>
          <button class="primary hunt-button" id="runBtn" type="button">오늘 영업 준비</button>
        </div>
      </div>

      <div class="summary" id="summary"></div>
      <section class="panel" id="content"></section>
    </main>
  </div>

  <script>
    (() => {
      const persistentKeys = {
        exaKey: 'kpa.hunt.exaKey',
        jinaKey: 'kpa.hunt.jinaKey',
        braveKey: 'kpa.hunt.braveKey',
        dartKey: 'kpa.hunt.dartKey'
      };

      // One-time migration: remove stale leads/messages,
      // but never remove user-entered API keys or rejected-domain feedback.
      const migrationKey = 'kpa.hunt.messageSchema';
      if (localStorage.getItem(migrationKey) !== 'v7') {
        ['kpa.hunt.leads','kpa.hunt.selected','kpa.hunt.cycle','kpa.hunt.firstRun','kpa.hunt.stopped'].forEach(key => localStorage.removeItem(key));
        localStorage.setItem(migrationKey, 'v7');
      }

      const restoreAndAutosave = () => {
        for (const [id, storageKey] of Object.entries(persistentKeys)) {
          const input = document.getElementById(id);
          if (!input) continue;
          const saved = localStorage.getItem(storageKey);
          if (saved) input.value = saved;
          input.addEventListener('input', () => {
            const value = input.value.trim();
            if (value) localStorage.setItem(storageKey, value);
            else localStorage.removeItem(storageKey);
          });
        }
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', restoreAndAutosave);
      else restoreAndAutosave();
    })();
  </script>

  <script>
    (() => {
      // Force one clean retry on existing K-Beauty candidates after replacing the old runtime path.
      const bootstrapKey = 'kpa.kbeauty.runtime-v5.2-bootstrap';
      if (localStorage.getItem(bootstrapKey) === '1') return;
      localStorage.removeItem('kpa.kbeauty.runtime-v5.1-reset');
      localStorage.removeItem('kpa.kbeauty.email-priority.v4');
      localStorage.setItem(bootstrapKey, '1');
    })();
  </script>

  <!-- Inline fallback: delete must remain available even if the separate helper script fails to load. -->
  <script>
    (() => {
      const DELETED_KEY = 'kpa.hunt.deletedDomains.v1';
      const MAX_DELETED = 2000;

      const normalizeDomain = (value = '') => {
        let raw = String(value || '').trim().toLowerCase();
        if (!raw) return '';
        if (raw.includes('@') && !raw.includes('://')) raw = raw.split('@').pop() || '';
        try { raw = new URL(raw.includes('://') ? raw : `https://${raw}`).hostname; }
        catch { raw = raw.split('/')[0].split(':')[0]; }
        raw = raw.replace(/^www\./, '').replace(/\.+$/, '');
        const parts = raw.split('.').filter(Boolean);
        if (parts.length <= 2) return raw;
        const secondLevel = new Set(['ac','co','com','edu','go','gov','ne','net','or','org']);
        const depth = parts.at(-1)?.length === 2 && secondLevel.has(parts.at(-2)) ? 3 : 2;
        return parts.slice(-depth).join('.');
      };

      const readDeleted = () => {
        try {
          const values = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]');
          return new Set((Array.isArray(values) ? values : []).map(normalizeDomain).filter(Boolean));
        } catch { return new Set(); }
      };

      const writeDeleted = (domains) => {
        localStorage.setItem(DELETED_KEY, JSON.stringify([...domains].slice(-MAX_DELETED)));
      };

      const leadDomain = (lead = {}) => normalizeDomain(lead.domain || lead.url || lead.contact?.email || '');

      const removeDeletedFromState = () => {
        if (typeof state === 'undefined' || !Array.isArray(state.leads)) return false;
        const deleted = readDeleted();
        if (!deleted.size) return false;
        const removedIds = [];
        const next = state.leads.filter((lead) => {
          const remove = deleted.has(leadDomain(lead));
          if (remove && lead?.id) removedIds.push(lead.id);
          return !remove;
        });
        if (next.length === state.leads.length) return false;
        state.leads = next;
        for (const id of removedIds) state.selected?.delete?.(id);
        if (typeof saveState === 'function') saveState();
        return true;
      };

      const deleteLead = (id) => {
        if (typeof state === 'undefined' || !Array.isArray(state.leads)) return;
        const lead = state.leads.find((item) => item.id === id);
        if (!lead) return;
        const domain = leadDomain(lead);
        if (!domain) return;

        const deleted = readDeleted();
        deleted.add(domain);
        writeDeleted(deleted);

        const removedIds = state.leads
          .filter((item) => leadDomain(item) === domain)
          .map((item) => item.id)
          .filter(Boolean);
        state.leads = state.leads.filter((item) => leadDomain(item) !== domain);
        for (const removedId of removedIds) state.selected?.delete?.(removedId);
        if (typeof saveState === 'function') saveState();
        if (typeof render === 'function') render();
      };

      const decorateDeleteButtons = (root = document) => {
        const rows = [];
        if (root.matches?.('tr.data-row')) rows.push(root);
        root.querySelectorAll?.('tr.data-row').forEach((row) => rows.push(row));
        for (const row of rows) {
          if (row.querySelector('[data-delete-lead]')) continue;
          const id = row.querySelector('.lead-check')?.dataset?.id;
          const actions = row.querySelector('.actions');
          if (!id || !actions) continue;
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'reject-btn permanent-delete-btn';
          button.dataset.deleteLead = id;
          button.textContent = '삭제';
          const reject = actions.querySelector('[data-reject]');
          if (reject) reject.insertAdjacentElement('afterend', button);
          else actions.appendChild(button);
        }
      };

      document.addEventListener('click', (event) => {
        const button = event.target.closest?.('[data-delete-lead]');
        if (!button) return;
        event.preventDefault();
        event.stopPropagation();
        deleteLead(button.dataset.deleteLead || '');
      }, true);

      const initialize = () => {
        if (typeof state === 'undefined') return;

        // Reuse the same permanent-delete history. Never resurrect a user-deleted company.
        const changed = removeDeletedFromState();
        if (changed && typeof render === 'function') render();
        decorateDeleteButtons();

        const content = document.getElementById('content');
        if (content) {
          new MutationObserver(() => decorateDeleteButtons(content))
            .observe(content, { childList: true, subtree: true });
        }

        // Keep deleted domains out of future hunt requests even if permanent-delete.js did not load.
        if (typeof post === 'function' && !post.__deleteFallbackWrapped) {
          const originalPost = post;
          const wrappedPost = async function(url, payload, timeout) {
            if (url !== '/api/hunt') return originalPost(url, payload, timeout);
            const deleted = [...readDeleted()];
            const excludeDomains = [...new Set([
              ...(Array.isArray(payload?.excludeDomains) ? payload.excludeDomains : []),
              ...deleted
            ].map(normalizeDomain).filter(Boolean))].slice(-500);
            const result = await originalPost(url, { ...(payload || {}), excludeDomains }, timeout);
            if (Array.isArray(result?.leads) && deleted.length) {
              const blocked = new Set(deleted);
              result.leads = result.leads.filter((lead) => !blocked.has(leadDomain(lead)));
            }
            return result;
          };
          wrappedPost.__deleteFallbackWrapped = true;
          post = wrappedPost;
        }
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize);
      else initialize();
    })();
  </script>
</body>
