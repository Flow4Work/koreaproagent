<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="해외 B2B SaaS를 찾아 담당자 이메일, 한국 잠재고객 3곳, 맞춤 메일까지 한 번에 준비하는 영업 도구" />
  <title>한국 시장 영업 에이전트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=20260728-2" />
  <link rel="stylesheet" href="/workflow.css?v=20260728-5" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">K</div>
        <div>
          <strong>한국 시장 영업 에이전트</strong>
          <span>오늘 보낼 회사 3곳을 바로 준비합니다</span>
        </div>
      </div>
      <div class="api-tools">
        <div class="status" id="apiStatus"><span class="dot"></span><span>연결 확인 중</span></div>
        <button class="ghost small" id="diagBtn" type="button">상태 확인</button>
      </div>
    </header>
    <div class="diag-panel hidden" id="diagPanel"></div>

    <main class="main compact-main">
      <section class="workspace">
        <aside class="panel input-panel">
          <div class="panel-head">
            <div><span class="step">START</span><h2>오늘 보낼 3곳</h2></div>
          </div>
          <p class="panel-desc">분석표를 보는 도구가 아닙니다. 회사·담당자 이메일·한국 샘플 3곳·보낼 메일까지 자동으로 만듭니다.</p>

          <div class="daily-topic-panel">
            <div class="daily-topic-head">
              <strong>오늘의 타깃</strong>
              <span id="topicTimeLabel">추천 준비 중</span>
            </div>
            <div class="topic-chips" id="dailyTopics"></div>
          </div>
          <input id="salesFocus" type="hidden" value="" />

          <button class="primary" id="salesRunBtn" type="button"><span>3곳 만들기</span></button>
          <div class="auto-note">최근 본 회사는 제외하고, 업무 이메일까지 찾은 회사를 우선합니다.</div>
        </aside>

        <section class="panel result-panel sales-result-panel">
          <div class="result-head">
            <div><span class="step">SEND</span><h2>오늘 보낼 메일</h2></div>
            <button class="send-all" id="sendAllBtn" type="button" disabled>3곳 메일 보내기</button>
          </div>

          <div class="empty" id="salesEmpty">
            <div class="empty-icon">↗</div>
            <h3>버튼 한 번이면 됩니다.</h3>
            <p>보낼 상대와 메일 내용까지 준비되면 이곳에 바로 나타납니다.</p>
          </div>

          <div class="loading hidden" id="salesLoading">
            <div class="spinner"></div>
            <h3 id="salesLoadingTitle">보낼 회사를 찾고 있습니다.</h3>
            <p id="salesLoadingText">회사 검증 → 담당자 이메일 → 한국 잠재고객 3곳 → 맞춤 메일</p>
            <div class="progress"><span></span></div>
          </div>

          <div class="error-box hidden" id="salesError"></div>
          <div class="results hidden" id="salesResults">
            <div class="sales-summary" id="salesSummary"></div>
            <div id="salesContent"></div>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="/app.js?v=20260728-5" defer></script>
</body>
</html>
