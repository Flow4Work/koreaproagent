<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="선택한 영업 후보의 A/B 메일을 검토하고 순차 발송하는 페이지" />
  <title>메일 준비 · 영업 사냥 에이전트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mail-review.css?v=20260801-kbw-mail-review-v4" />
</head>
<body>
  <div class="review-shell">
    <section class="review-toolbar">
      <div class="toolbar-left">
        <a class="back-link" href="/">← 후보 목록</a>
        <div class="review-summary" id="reviewSummary">불러오는 중…</div>
      </div>
      <div class="review-actions">
        <button class="connection" id="gmailConnectBtn" type="button">Gmail 연결 설정</button>
        <button class="test-all" id="testSendBtn" type="button">테스트 보내기</button>
        <button class="danger hidden" id="stopSendBtn" type="button">발송 중지</button>
        <button class="send-all" id="sendAllBtn" type="button">전부 보내기</button>
      </div>
    </section>

    <main id="mailCards" class="mail-cards"></main>
  </div>

  <dialog id="testSendDialog">
    <form class="dialog-form" method="dialog">
      <div class="dialog-head">
        <strong>테스트 메일 보내기</strong>
        <button class="dialog-close" value="cancel" aria-label="닫기">×</button>
      </div>
      <div class="field">
        <label for="testCompany">테스트할 회사</label>
        <select id="testCompany"></select>
      </div>
      <div class="field">
        <label for="testRecipient">테스트 수신 주소</label>
        <input id="testRecipient" type="email" value="treecox19@gmail.com" autocomplete="email" />
      </div>
      <p class="dialog-context" id="testMailContext"></p>
      <div class="dialog-actions">
        <button class="ghost" value="cancel">취소</button>
        <button class="test-all" id="confirmTestSend" type="button">테스트 발송</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      const migrationKey = 'kpa.mail.signatureSchema';
      const leadsKey = 'kpa.hunt.leads';
      const genericDomains = new Set([
        'gmail.com', 'googlemail.com', 'outlook.com', 'hotmail.com', 'live.com',
        'yahoo.com', 'icloud.com', 'me.com', 'proton.me', 'protonmail.com'
      ]);
      const normalize = value => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const domainFrom = value => {
        let text = String(value || '').trim().toLowerCase();
        if (text.includes('@')) text = text.split('@').pop();
        text = text.replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?#]/)[0].replace(/:\d+$/, '');
        return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(text) ? text : '';
      };
      const domainLabel = domain => {
        const parts = String(domain || '').split('.').filter(Boolean);
        if (parts.length < 2) return '';
        const secondLevel = new Set(['co', 'com', 'net', 'org', 'ac', 'go']);
        const index = parts.length >= 3 && secondLevel.has(parts[parts.length - 2]) ? parts.length - 3 : parts.length - 2;
        return parts[index] || '';
      };
      const displayDomain = label => String(label || '')
        .split(/[-_]+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(' ');
      const verifiedDomain = lead => [
        lead?.contact?.email,
        ...(Array.isArray(lead?.contacts) ? lead.contacts.map(contact => contact?.email) : []),
        lead?.domain,
        lead?.url
      ].map(domainFrom).find(domain => domain && !genericDomains.has(domain)) || '';
      const matchedPrefix = (raw, label) => {
        const target = normalize(label);
        if (!target) return '';
        const words = String(raw).replace(/[|:—–]/g, ' ').split(/\s+/).filter(Boolean).filter(word => word !== '&');
        const prefixes = [];
        for (let count = 1; count <= Math.min(4, words.length); count += 1) {
          const prefix = words.slice(0, count).join(' ').replace(/[,:;]+$/, '').trim();
          const token = normalize(prefix);
          prefixes.push({ prefix, token });
          if (token === target) return prefix;
        }
        const partial = prefixes.reverse().find(({ token }) => token.length >= 4 && target.includes(token) && token.length / target.length >= 0.6);
        return partial?.prefix || '';
      };
      const cleanCompany = lead => {
        const raw = String(lead?.company || '').replace(/\s+team$/i, '').trim();
        if (!raw) return raw;
        const words = raw.split(/\s+/).filter(Boolean);
        const separatorShort = raw.split(/\s*(?::|\||—|–)\s*/)[0].replace(/\s+-\s+.*$/, '').trim();
        const ampersandShort = raw.split(/\s+(?:&|and)\s+/i)[0].trim();
        const hasSeparator = separatorShort !== raw;
        const hasLongAmpersandTail = ampersandShort !== raw && words.length > 4;
        const descriptorHits = (raw.match(/\b(insights?|trends?|innovation|marketing|agency|gtm|real estate|proptech|news|media|community|platform|solutions?|services?|network|directory|guide|research|consulting|advisory)\b/gi) || []).length;
        const suspicious = hasSeparator || hasLongAmpersandTail || words.length > 5 || raw.length > 48 || descriptorHits >= 3;
        if (!suspicious) return raw;

        const label = domainLabel(verifiedDomain(lead));
        const prefix = matchedPrefix(raw, label);
        const candidates = [
          hasSeparator ? separatorShort : '',
          hasLongAmpersandTail ? ampersandShort : '',
          prefix
        ].filter(Boolean);
        const verified = candidates.find(candidate => {
          const token = normalize(candidate);
          const domainToken = normalize(label);
          return token && (!domainToken || token === domainToken || (domainToken.includes(token) && token.length >= 4 && token.length / domainToken.length >= 0.6));
        });
        return (verified || prefix || candidates.find(candidate => candidate.split(/\s+/).length <= 4 && candidate.length <= 40) || displayDomain(label) || words.slice(0, 3).join(' ')).slice(0, 40).trim();
      };

      try {
        const leads = JSON.parse(localStorage.getItem(leadsKey) || '[]');
        let changed = false;
        if (Array.isArray(leads)) {
          leads.forEach(lead => {
            const nextName = cleanCompany(lead);
            if (nextName && nextName !== lead.company) {
              lead.company = nextName;
              changed = true;
            }
          });
          if (changed) localStorage.setItem(leadsKey, JSON.stringify(leads));
        }
      } catch {}

      if (localStorage.getItem(migrationKey) !== 'v7') {
        localStorage.removeItem('kpa.mail.review.drafts.v4');
        localStorage.removeItem('kpa.mail.review.drafts.v5');
        localStorage.setItem(migrationKey, 'v7');
      }
    })();
  </script>
  <script src="/mail-templates.js?v=20260801-kbw-mail-review-v7" defer></script>
  <script src="/sent-history.js?v=20260802-sent-history-ui-v1" defer></script>
  <script src="/mail-review.js?v=20260803-visible-multi-contact-v1" defer></script>
</body>
</html>
