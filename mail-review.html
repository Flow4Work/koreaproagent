<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="선택한 영업 후보의 A/B 메일을 검토하고 순차 발송하는 페이지" />
  <title>메일 준비하기 · 영업 사냥 에이전트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mail-review.css?v=20260801-kbw-mail-review-v1" />
</head>
<body>
  <div class="review-shell">
    <header class="review-topbar">
      <a class="back-link" href="/">← 후보 목록</a>
      <div>
        <h1>메일 준비하기</h1>
        <p>받는 주소와 A/B 본문을 확인한 뒤 실제 발송합니다.</p>
      </div>
      <button class="ghost" id="gmailConnectBtn" type="button">Gmail 상태 확인</button>
    </header>

    <section class="review-toolbar">
      <div class="review-summary" id="reviewSummary">불러오는 중…</div>
      <div class="review-actions">
        <button class="ghost" id="applyAllA" type="button">전체 A 적용</button>
        <button class="ghost" id="applyAllB" type="button">전체 B 적용</button>
        <button class="danger hidden" id="stopSendBtn" type="button">발송 중지</button>
        <button class="primary" id="sendAllBtn" type="button">전부 보내기</button>
      </div>
    </section>

    <div class="queue-note" id="queueNote">
      메일은 한 번에 한 건씩 60~180초 간격으로 발송됩니다. 발송 중에는 이 페이지를 열어두세요.
    </div>

    <main id="mailCards" class="mail-cards"></main>
  </div>

  <script src="/mail-review.js?v=20260801-kbw-mail-review-v1" defer></script>
</body>
</html>
